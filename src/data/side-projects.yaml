- id: 3d-renderer-cpp
  title: "Real-time C++ 3D renderer"
  url: "https://github.com/balintkissdev/3d-renderer-cpp"
  domain: "Graphics"
  badges: ["C++", "Direct3D 12", "OpenGL", "WebGL", "WebAssembly", "Emscripten"]
  image: "3d_renderer_cpp_preview.png"
  description: |
    A hardware-accelerated 3D renderer written in C++. Runs using Direct3D 12 or OpenGL as graphics API on desktop and WebGL2 in web browsers.

    [Desktop browser-playable live demo](https://balintkissdev.github.io/3d-renderer-cpp) is compiled to WebAssembly using Emscripten.

- id: awesome-dos
  title: "Awesome DOS"
