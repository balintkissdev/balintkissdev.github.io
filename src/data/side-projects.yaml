- id: raycaster-engine
  title: "Raycasting pseudo-3D graphics engine"
  url: "https://github.com/balintkissdev/raycaster-engine"
  domain: "Graphics"
  badges: ["C++", "SDL2", "WebAssembly", "Emscripten"]
  image: "raycaster_engine_preview.png"
  description: |
    Retro 3D graphics engine demo I've written back in 2016, inspired by techniques used in Wolfenstein 3D. Uses vector math and CPU-based software rendering to turn 2D maps into 3D space, includes double-buffering and texture mapping.

    [Desktop browser-playable live demo](https://balintkissdev.github.io/raycaster-engine/) is compiled to WebAssembly using Emscripten.
