- id: awesome-dos
  title: "Awesome DOS"
  repoUrl: "https://github.com/balintkissdev/awesome-dos#readme"
  domain: "Retro programming"
  image: "awesome_dos_preview.png"
  githubStarRepo: "balintkissdev/awesome-dos"
  description: |
    Thanks to my nostalgia for retro DOS computing, I curated a list of references for development of DOS applications and learning about the system itself. The goal of this list is to collect information and act as a starting point for someone who wants to start out retro-programming for the DOS platform.

    This list is [featured](https://twitter.com/awesome__re/status/1355813614469271555) on the official [Awesome collection](https://github.com/sindresorhus/awesome) made by Sindre Sorhus.

- id: 3d-renderer-cpp
  title: "Real-time C++ 3D renderer"
  repoUrl: "https://github.com/balintkissdev/3d-renderer-cpp"
  demoUrl: "/3d-renderer-cpp"
  domain: "Graphics"
  badges: ["C++", "Direct3D 12", "OpenGL", "WebGL", "ImGui", "WebAssembly", "Emscripten"]
  image: "3d_renderer_cpp_preview.png"
  description: |
    API-agnostic C++ 3D renderer supporting Direct3D 12 or OpenGL as selectable graphics API backends. Whenever I want to experiment with a new rendering technique, I use this as a sandbox.

- id: raycaster-engine
  title: "Raycasting pseudo-3D graphics engine"
  repoUrl: "https://github.com/balintkissdev/raycaster-engine"
  demoUrl: "/raycaster-engine/"
  domain: "Graphics"
  badges: ["C++", "SDL2", "WebAssembly", "Emscripten"]
  image: "raycaster_engine_preview.png"
  description: |
    Retro 3D graphics engine demo inspired by techniques used in Wolfenstein 3D. Uses CPU-based software rendering to project 2D level maps into 3D space, includes double-buffering and texture mapping. Trivia: this was the project I made back in 2016 that helped me get better at C++.

- id: realtime-chat-rust
  title: "Real-time chat application service written in Rust"
  repoUrl: "https://github.com/balintkissdev/realtime-chat-rust"
  domain: "Network"
  badges: ["Rust", "TypeScript", "Tokio", "WebSocket", "Actix Web"]
  image: "realtime_chat_rust_preview.png"
  description: |
    A TCP/WebSocket networking project used to mix together Rust for chat backend and TypeScript for frontend.

